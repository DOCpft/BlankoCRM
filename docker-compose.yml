services:
    postgres:
        image: postgres:15
        container_name: pg_blanko
        environment:
            POSTGRES_USER: blanko
            POSTGRES_PASSWORD: blanko_pass
            POSTGRES_DB: blankocrm
        ports:
            - "5433:5432"
        volumes:
            - postgres_data:/var/lib/postgresql/data
        restart: unless-stopped
    seq:
      image: datalust/seq:latest
      container_name: blanko_seq
      environment:
        - ACCEPT_EULA=Y
        - SEQ_FIRSTRUN_ADMINPASSWORD=YourStrongPassword123!
      ports:
        - "5341:80"
      volumes:
        - seq_data:/data
      restart: unless-stopped
    
    prometheus:
      image: prom/prometheus:v2.53.0
      container_name: blanko_prometheus
      volumes:
        - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
        - prometheus_data:/prometheus
      ports:
        - "9090:9090"
      extra_hosts:
        - "host.docker.internal:host-gateway"
      restart: unless-stopped
      mem_limit: 512m

    grafana:
      image: grafana/grafana:11.1.0
      container_name: blanko_grafana
      environment:
        - GF_SECURITY_ADMIN_USER=admin
        - GF_SECURITY_ADMIN_PASSWORD=admin
        - GF_USERS_ALLOW_SIGN_UP=false
      volumes:
        - grafana_data:/var/lib/grafana
      ports:
        - "3000:3000"
      restart: unless-stopped
      mem_limit: 384m
      depends_on:
        - prometheus
volumes:
    postgres_data:
    seq_data:
    prometheus_data:
    grafana_data:

