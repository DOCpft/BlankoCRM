version: "3.8"

services:
    postgres:
        image: postgres:15
        container_name: pg_blanko
        environment:
            POSTGRES_USER: blanko
            POSTGRES_PASSWORD: blanko_pass
            POSTGRES_DB: blankocrm
        ports:
            - "5433:5432"
        volumes:
            - postgres_data:/var/lib/postgresql/data
        restart: unless-stopped
volumes:
    postgres_data: