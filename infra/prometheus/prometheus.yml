global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'blankocrm-api'
    scheme: http
    metrics_path: /metrics
    static_configs:
      - targets: ['host.docker.internal:5102']
        labels:
          application: 'blankocrm'
          environment: 'development'
